name: Aggiorna Contatore Instagram

on:
  schedule:
    # Gira ogni 10 minuti, dalle 19:00 alle 02:00 (ora italiana), dal martedì alla domenica
    - cron: '*/10 17-23,0 * * 2-6,0'
  workflow_dispatch: # Permette l'avvio manuale in qualsiasi momento

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: pip install requests

      - name: Esegui lo script
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python ig_scraper.py
