
name: Aggiorna Contatore Instagram

on:
  schedule:
    # Serate da martedì a domenica, dalle 19 alle 23:50.
    - cron: "*/10 19-23 * * 0,2-6"
      timezone: "Europe/Rome"

    # Prosegue dopo mezzanotte fino alle 02:50.
    # Comprende il lunedì mattina dopo la domenica sera.
    - cron: "*/10 0-2 * * 0-1,3-6"
      timezone: "Europe/Rome"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-counter
  cancel-in-progress: false

jobs:
  update-counter:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: python -m pip install requests

      - name: Aggiorna dati Instagram
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python ig-counter.py
